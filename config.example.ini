# Configuration de Miwer
# À copier dans ~/.config/miwer/config.ini

# Port série de l'appareil USB. Préférer le lien stable de /dev/serial/by-id/
device = /dev/ttyACM0
baudrate = 115200

# Valeur brute maximale envoyée par un potentiomètre (1023 pour un ADC 10 bits, 4095 pour 12 bits)
adc_max = 1023

# Variation minimale (0..1) avant d'appliquer un nouveau volume, pour filtrer le bruit des potentiomètres
noise_threshold = 0.01

# Inverse le sens des potentiomètres
invert_sliders = false

# toggle : l'appareil envoie l'état du bouton (1 = appuyé), chaque appui bascule le mute
# state  : l'appareil gère lui-même le mute et envoie son état (1 = muet)
mute_mode = toggle

verbose = false

# Affectation des canaux. Plusieurs applications séparées par des virgules.
# Une application est reconnue par son application.name, son application.process.binary
# ou son node.name (insensible à la casse). Lancer « miwer -v » pour voir les noms détectés.
#
# Cibles spéciales :
#   master : sortie audio par défaut
#   mic    : entrée audio (micro) par défaut
#   others : toutes les applications non assignées à un autre canal
channel1 = master
channel2 = firefox, chromium, chrome
channel3 = spotify
channel4 = discord, webcord
channel5 = others
