# Configuration de Miwer
# À copier dans ~/.config/miwer/config.ini

# Port série de l'appareil USB.
# auto : cherche dans /dev/serial/by-id/ une entrée contenant « Miwer », sinon /dev/ttyACM0
# (la détection est refaite à chaque tentative de reconnexion).
# On peut aussi donner un chemin, de préférence le lien stable de /dev/serial/by-id/
device = auto
# Ignoré par l'appareil STM32 (USB natif) ; utile pour le firmware Arduino de référence
baudrate = 115200

# Les faders motorisés suivent les changements de volume / mute faits ailleurs
# (touches multimédia, pavucontrol, application qui change son propre volume).
# Au démarrage, un canal prend le volume réel de ses applications (ex. volume système pour master).
# false : Miwer impose ses volumes et ignore les changements externes.
follow_external = true

# Inverse le sens des faders (dans les deux sens : positions reçues et SET envoyés)
invert_sliders = false

# toggle : chaque appui sur un bouton bascule le mute du canal
# state  : l'appareil envoie directement l'état du mute (1 = muet) ; surtout pour l'ancien format
mute_mode = toggle

verbose = false

# --- Ancien format de trame (firmware Arduino de référence : v1|v2|v3|v4|v5|m1|m2|m3|m4|m5)
# Valeur brute maximale envoyée par un potentiomètre (1023 pour un ADC 10 bits, 4095 pour 12 bits)
adc_max = 1023
# Variation minimale (0..1) avant d'appliquer un nouveau volume, pour filtrer le bruit
noise_threshold = 0.01

# Affectation des canaux. Plusieurs applications séparées par des virgules.
# Une application est reconnue par son application.name, son application.process.binary
# ou son node.name (insensible à la casse). Lancer « miwer -v » pour voir les noms détectés.
#
# Cibles spéciales :
#   master : sortie audio par défaut
#   mic    : entrée audio (micro) par défaut
#   others : toutes les applications non assignées à un autre canal
channel1 = master
channel2 = firefox, chromium, chrome
channel3 = spotify
channel4 = discord, webcord
channel5 = others

# Libellés affichés par l'écran de l'appareil (8 caractères au plus, accents translittérés,
# autres caractères non ASCII supprimés).
# Par défaut : master -> Master, mic -> Micro, others -> Autres, sinon la première
# application du canal avec une majuscule (ex. « Firefox »).
#label1 = Système
#label2 = Web
#label3 = Musique
#label4 = Discord
#label5 = Autres
